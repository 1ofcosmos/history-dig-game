<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>유적 발굴 탐험대</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #1b1410;
    overflow: hidden;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    touch-action: none;
    user-select: none;
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  #gameCanvas {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #4a3a2a;
    image-rendering: pixelated;
  }

  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-align: center;
    background: linear-gradient(#5b4632, #3a2d20);
    z-index: 30;
  }
  .screen h1 {
    font-size: clamp(28px, 5vw, 48px);
    margin-bottom: 8px;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.4);
  }
  .screen p {
    font-size: clamp(14px, 2.2vw, 18px);
    opacity: 0.85;
    margin-bottom: 28px;
  }
  .mapChoices {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .mapBtn {
    width: clamp(160px, 24vw, 230px);
    padding: 20px 14px;
    border-radius: 18px;
    border: 4px solid #8a6a42;
    background: #caa868;
    color: #3a2a15;
    font-size: clamp(18px, 2.6vw, 24px);
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.3);
  }
  .mapBtn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.3);
  }
  .mapBtn .emoji { font-size: clamp(36px, 5vw, 56px); display: block; margin-bottom: 6px; }

  #hudLayer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }
  #mapLabel {
    position: absolute;
    top: max(12px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.45);
    color: #fff;
    padding: 6px 18px;
    border-radius: 999px;
    font-size: clamp(14px, 2vw, 20px);
    font-weight: bold;
  }

  #joystickZone {
    position: absolute;
    left: max(24px, env(safe-area-inset-left));
    bottom: max(24px, env(safe-area-inset-bottom));
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 3px solid rgba(255,255,255,0.35);
    pointer-events: auto;
  }
  #joystickStick {
    position: absolute;
    width: 56px;
    height: 56px;
    left: 37px;
    top: 37px;
    border-radius: 50%;
    background: rgba(255,255,255,0.75);
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }

  #actionZone {
    position: absolute;
    right: max(24px, env(safe-area-inset-right));
    bottom: max(24px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 14px;
    pointer-events: auto;
  }
  .actionBtn {
    width: 86px;
    height: 86px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.5);
    background: rgba(220,160,70,0.85);
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .actionBtn .icon { font-size: 30px; line-height: 1; }
  #bagBtn { background: rgba(90,130,200,0.85); }
  #bagBtn.bump { animation: bagBump 0.4s ease; }
  @keyframes bagBump {
    0% { transform: scale(1); }
    35% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }
  #bagCount {
    position: absolute;
    top: -6px;
    right: -6px;
    background: #d23c3c;
    color: #fff;
    font-size: 13px;
    min-width: 22px;
    height: 22px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
  }

  #backBtn {
    position: absolute;
    top: max(12px, env(safe-area-inset-top));
    left: max(12px, env(safe-area-inset-left));
    pointer-events: auto;
    background: rgba(0,0,0,0.45);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
  }

  #restartBtn {
    position: absolute;
    top: max(12px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right));
    z-index: 35;
    pointer-events: auto;
    background: rgba(190,60,50,0.85);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
  }

  #bagModal {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 40;
    pointer-events: auto;
  }
  #bagModal.open { display: flex; }
  #bagPanel {
    background: #fdf6e3;
    border-radius: 20px;
    width: min(680px, 90vw);
    max-height: 82vh;
    padding: 20px 24px;
    overflow-y: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  #bagPanel h2 {
    margin: 0 0 14px;
    color: #4a3521;
    font-size: clamp(20px, 3vw, 28px);
  }
  #bagGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 14px;
  }
  .bagItem {
    background: #fff;
    border-radius: 12px;
    padding: 10px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .bagItem img, .bagItem .placeholder {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 6px;
  }
  .bagItem .placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #cbb48a;
    color: #4a3521;
    font-size: 12px;
    font-weight: bold;
  }
  .bagItem .label { font-size: 14px; font-weight: bold; color: #3a2a15; }
  #bagEmpty { color: #8a7355; padding: 20px 4px; font-size: 15px; }
  #closeBagBtn {
    display: block;
    margin: 18px auto 0;
    padding: 10px 28px;
    border: none;
    border-radius: 999px;
    background: #8a6a42;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }

  #rotateNotice {
    position: absolute;
    inset: 0;
    background: #1b1410;
    color: #fff;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    z-index: 100;
    font-size: 18px;
    gap: 10px;
  }
  #rotateNotice .icon { font-size: 54px; }
  body.portrait #rotateNotice { display: flex; }

  #popupLayer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 20;
  }
  .popupItem {
    position: absolute;
    width: 72px;
    height: 72px;
    transform: translate(-50%, -50%);
    transition: left 0.6s ease-in, top 0.6s ease-in, width 0.6s ease-in, height 0.6s ease-in, opacity 0.6s ease-in;
  }
  .popupItem img, .popupItem .placeholder {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
  }
  .popupItem .placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #cbb48a;
    color: #3a2a15;
    font-size: 11px;
    font-weight: bold;
    text-align: center;
  }
  .popupName {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 13px;
    padding: 2px 8px;
    border-radius: 999px;
    margin-top: 4px;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gameCanvas"></canvas>

  <button id="restartBtn">🔄 새로 시작</button>

  <div id="popupLayer"></div>

  <div id="hudLayer">
    <button id="backBtn">← 지도 선택</button>
    <div id="mapLabel"></div>
    <div id="joystickZone"><div id="joystickStick"></div></div>
    <div id="actionZone">
      <div class="actionBtn" id="digBtn"><span class="icon">⛏️</span>파기</div>
      <div class="actionBtn" id="bagBtn"><span class="icon">🎒</span>가방<span id="bagCount" style="display:none">0</span></div>
    </div>
  </div>

  <div id="bagModal">
    <div id="bagPanel">
      <h2>내 가방</h2>
      <div id="bagEmpty" style="display:none">아직 찾은 유물이 없어요. 땅을 파 보세요!</div>
      <div id="bagGrid"></div>
      <button id="closeBagBtn">닫기</button>
    </div>
  </div>

  <div id="startScreen" class="screen">
    <h1>유적 발굴 탐험대</h1>
    <p>지도를 골라서 땅을 파고 유물을 찾아보세요!</p>
    <div class="mapChoices" id="mapChoices"></div>
  </div>

  <div id="rotateNotice">
    <div class="icon">📱↻</div>
    <div>화면을 가로로 돌려주세요</div>
  </div>
</div>

<script src="data.js"></script>
<script>
(function () {
  const TILE = 64;
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const stage = document.getElementById("stage");
  const startScreen = document.getElementById("startScreen");
  const mapChoices = document.getElementById("mapChoices");
  const mapLabelEl = document.getElementById("mapLabel");
  const backBtn = document.getElementById("backBtn");
  const restartBtn = document.getElementById("restartBtn");
  const digBtn = document.getElementById("digBtn");
  const bagBtn = document.getElementById("bagBtn");
  const bagCountEl = document.getElementById("bagCount");
  const bagModal = document.getElementById("bagModal");
  const bagGrid = document.getElementById("bagGrid");
  const bagEmpty = document.getElementById("bagEmpty");
  const closeBagBtn = document.getElementById("closeBagBtn");
  const joystickZone = document.getElementById("joystickZone");
  const joystickStick = document.getElementById("joystickStick");
  const popupLayer = document.getElementById("popupLayer");

  const STORAGE_KEY = "digGameProgress_v2";
  function loadProgress() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    } catch (e) {
      return {};
    }
  }
  function saveProgress(progress) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
    } catch (e) {}
  }
  const progress = loadProgress();

  const mapEmoji = { goguryeo: "🏯", balhae: "⛩️" };
  Object.keys(MAPS).forEach(function (key) {
    const def = MAPS[key];
    const btn = document.createElement("button");
    btn.className = "mapBtn";
    btn.innerHTML = '<span class="emoji">' + (mapEmoji[key] || "🗺️") + "</span>" + def.label;
    btn.addEventListener("click", function () { startMap(key); });
    mapChoices.appendChild(btn);
  });

  const imageCache = {};
  function getImage(src) {
    if (imageCache[src]) return imageCache[src];
    const img = new Image();
    img.src = src;
    const entry = { img: img, ok: null };
    img.onload = function () { entry.ok = true; };
    img.onerror = function () { entry.ok = false; };
    imageCache[src] = entry;
    return entry;
  }

  function getArtifactDef(id) {
    return ARTIFACTS.find(function (a) { return a.id === id; });
  }

  let currentMapKey = null;
  let mapDef = null;
  let mapSpots = [];
  let collectedCounts = {};
  let dugTiles = new Set();
  let player = { x: 0, y: 0, dir: "down", moving: false };
  const keys = {};
  let joyVec = { x: 0, y: 0 };
  const DIG_WINDUP = 0.22;
  const DIG_IMPACT_TIME = 0.32;
  const DIG_TOTAL = 0.55;
  let dig = { active: false, t: 0, impactDone: false, spot: null, tile: null };
  const particles = [];
  let decorations = [];
  let blockingTiles = new Set();
  let groundTones = [];

  function tileKey(x, y) { return x + "_" + y; }

  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashStringToSeed(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) { h = (h << 5) - h + str.charCodeAt(i); h |= 0; }
    return h;
  }
  function shadeColor(hex, percent) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = Math.max(0, Math.min(255, Math.round(r + (percent / 100) * 255)));
    g = Math.max(0, Math.min(255, Math.round(g + (percent / 100) * 255)));
    b = Math.max(0, Math.min(255, Math.round(b + (percent / 100) * 255)));
    return "#" + [r, g, b].map(function (v) { return v.toString(16).padStart(2, "0"); }).join("");
  }

  function isNearOccupied(x, y, occupied, r) {
    for (let dx = -r; dx <= r; dx++) {
      for (let dy = -r; dy <= r; dy++) {
        if (occupied.has(tileKey(x + dx, y + dy))) return true;
      }
    }
    return false;
  }

  const DECO_PALETTES = {
    mountain: [
      { type: "pine", weight: 3, blocking: true },
      { type: "rock_big", weight: 2, blocking: true },
      { type: "rock_small", weight: 3, blocking: false },
      { type: "grass", weight: 4, blocking: false }
    ],
    field: [
      { type: "broadleaf", weight: 5, blocking: true },
      { type: "bush", weight: 3, blocking: false },
      { type: "flower", weight: 3, blocking: false },
      { type: "rock_small", weight: 1, blocking: false }
    ]
  };

  function buildDecorations(mapKey, def, occupied) {
    const rand = mulberry32(hashStringToSeed(mapKey + "_deco"));
    const palette = DECO_PALETTES[def.theme] || DECO_PALETTES.field;
    const totalWeight = palette.reduce(function (s, p) { return s + p.weight; }, 0);
    function pickType() {
      let r = rand() * totalWeight;
      for (let i = 0; i < palette.length; i++) {
        if (r < palette[i].weight) return palette[i];
        r -= palette[i].weight;
      }
      return palette[0];
    }

    const eligible = [];
    for (let y = 0; y < def.rows; y++) {
      for (let x = 0; x < def.cols; x++) {
        const key = tileKey(x, y);
        if (occupied.has(key)) continue;
        if (isNearOccupied(x, y, occupied, 1)) continue;
        if (x <= 1 && y <= 1) continue;
        eligible.push({ x: x, y: y });
      }
    }
    for (let i = eligible.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      const tmp = eligible[i]; eligible[i] = eligible[j]; eligible[j] = tmp;
    }

    const targetCount = Math.round(eligible.length * 0.45);
    const list = [];
    const blocked = new Set();
    for (let i = 0; i < targetCount; i++) {
      const x = eligible[i].x, y = eligible[i].y;
      const p = pickType();
      list.push({ x: x, y: y, type: p.type, variant: rand() });
      if (p.blocking) blocked.add(tileKey(x, y));
    }
    return { list: list, blocked: blocked };
  }

  function startMap(key) {
    currentMapKey = key;
    mapDef = MAPS[key];
    const saved = progress[key] || {};
    const savedDigCounts = saved.digCounts || {};
    collectedCounts = Object.assign({}, saved.counts || {});
    dugTiles = new Set(saved.dug || []);

    mapSpots = (SPOTS[key] || []).map(function (s, i) {
      const spotId = i + "_" + s.x + "_" + s.y;
      const def = s.artifactId ? getArtifactDef(s.artifactId) : null;
      if (def && def.image) getImage(def.image);
      const digsRequired = s.digsRequired || pickDigsRequired(key, s.x, s.y);
      const digCount = savedDigCounts[spotId] || 0;
      return {
        id: spotId,
        x: s.x,
        y: s.y,
        artifactId: s.artifactId,
        digsRequired: digsRequired,
        digCount: digCount,
        completed: digCount >= digsRequired
      };
    });

    const occupied = new Set(mapSpots.map(function (s) { return tileKey(s.x, s.y); }));
    const deco = buildDecorations(key, mapDef, occupied);
    decorations = deco.list;
    blockingTiles = deco.blocked;
    groundTones = [
      mapDef.groundColor,
      mapDef.groundColor2,
      shadeColor(mapDef.groundColor, -8),
      shadeColor(mapDef.groundColor2, 8)
    ];

    player.x = TILE * 1.5;
    player.y = TILE * 1.5;
    mapLabelEl.textContent = mapDef.label;
    startScreen.style.display = "none";
    resize();
    updateBagCount();
  }

  function backToStart() {
    currentMapKey = null;
    startScreen.style.display = "flex";
  }
  backBtn.addEventListener("click", backToStart);

  function resetProgress() {
    const ok = window.confirm("정말 처음부터 다시 할까요?\n지금까지 모은 유물 기록이 모두 지워져요.");
    if (!ok) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    Object.keys(progress).forEach(function (k) { delete progress[k]; });
    currentMapKey = null;
    startScreen.style.display = "flex";
  }
  restartBtn.addEventListener("click", resetProgress);

  function persistMapState() {
    if (!currentMapKey) return;
    const digCounts = {};
    mapSpots.forEach(function (s) { if (s.digCount > 0) digCounts[s.id] = s.digCount; });
    progress[currentMapKey] = {
      digCounts: digCounts,
      counts: collectedCounts,
      dug: Array.from(dugTiles)
    };
    saveProgress(progress);
  }

  function resize() {
    const cols = mapDef ? mapDef.cols : 10;
    const rows = mapDef ? mapDef.rows : 7;
    const targetW = cols * TILE;
    const targetH = rows * TILE;
    const viewW = stage.clientWidth;
    const viewH = stage.clientHeight;
    const scale = Math.min(viewW / targetW, viewH / targetH, 1.4);
    canvas.width = targetW;
    canvas.height = targetH;
    canvas.style.width = (targetW * scale) + "px";
    canvas.style.height = (targetH * scale) + "px";
  }
  window.addEventListener("resize", resize);

  function checkOrientation() {
    document.body.classList.toggle("portrait", window.innerHeight > window.innerWidth);
  }
  window.addEventListener("resize", checkOrientation);
  checkOrientation();

  window.addEventListener("keydown", function (e) {
    keys[e.key.toLowerCase()] = true;
    if (e.key === " ") { e.preventDefault(); doDig(); }
    if (e.key.toLowerCase() === "i") toggleBag();
    if (e.key === "Escape") closeBag();
  });
  window.addEventListener("keyup", function (e) { keys[e.key.toLowerCase()] = false; });

  let joyActive = false;
  let joyId = null;
  let joyCenter = { x: 0, y: 0 };
  function joyStart(clientX, clientY, id) {
    joyActive = true;
    joyId = id;
    const rect = joystickZone.getBoundingClientRect();
    joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    joyMove(clientX, clientY);
  }
  function joyMove(clientX, clientY) {
    if (!joyActive) return;
    const maxR = 45;
    let dx = clientX - joyCenter.x;
    let dy = clientY - joyCenter.y;
    const dist = Math.min(Math.hypot(dx, dy), maxR);
    const angle = Math.atan2(dy, dx);
    const sx = Math.cos(angle) * dist;
    const sy = Math.sin(angle) * dist;
    joystickStick.style.left = (37 + sx) + "px";
    joystickStick.style.top = (37 + sy) + "px";
    joyVec.x = dist > 8 ? Math.cos(angle) * (dist / maxR) : 0;
    joyVec.y = dist > 8 ? Math.sin(angle) * (dist / maxR) : 0;
  }
  function joyEnd() {
    joyActive = false;
    joyId = null;
    joyVec = { x: 0, y: 0 };
    joystickStick.style.left = "37px";
    joystickStick.style.top = "37px";
  }
  joystickZone.addEventListener("pointerdown", function (e) {
    joystickZone.setPointerCapture(e.pointerId);
    joyStart(e.clientX, e.clientY, e.pointerId);
  });
  joystickZone.addEventListener("pointermove", function (e) {
    if (e.pointerId === joyId) joyMove(e.clientX, e.clientY);
  });
  joystickZone.addEventListener("pointerup", function (e) { if (e.pointerId === joyId) joyEnd(); });
  joystickZone.addEventListener("pointercancel", function (e) { if (e.pointerId === joyId) joyEnd(); });

  digBtn.addEventListener("pointerdown", function (e) { e.preventDefault(); doDig(); });
  bagBtn.addEventListener("pointerdown", function (e) { e.preventDefault(); toggleBag(); });
  closeBagBtn.addEventListener("click", closeBag);
  bagModal.addEventListener("pointerdown", function (e) { if (e.target === bagModal) closeBag(); });

  function toggleBag() { bagModal.classList.contains("open") ? closeBag() : openBag(); }
  function openBag() {
    renderBag();
    bagModal.classList.add("open");
  }
  function closeBag() { bagModal.classList.remove("open"); }

  function renderBag() {
    const ids = Object.keys(collectedCounts).filter(function (id) { return collectedCounts[id] > 0; });
    bagGrid.innerHTML = "";
    bagEmpty.style.display = ids.length ? "none" : "block";
    ids.forEach(function (id) {
      const a = getArtifactDef(id);
      if (!a) return;
      const count = collectedCounts[id];
      const cell = document.createElement("div");
      cell.className = "bagItem";
      const entry = a.image ? getImage(a.image) : null;
      if (entry && entry.ok) {
        const img = document.createElement("img");
        img.src = a.image;
        cell.appendChild(img);
      } else {
        const ph = document.createElement("div");
        ph.className = "placeholder";
        ph.textContent = a.name;
        cell.appendChild(ph);
      }
      const label = document.createElement("div");
      label.className = "label";
      label.textContent = count > 1 ? a.name + " × " + count : a.name;
      cell.appendChild(label);
      bagGrid.appendChild(cell);
    });
  }

  function bumpBagButton() {
    bagBtn.classList.remove("bump");
    void bagBtn.offsetWidth;
    bagBtn.classList.add("bump");
  }

  function updateBagCount() {
    const n = Object.keys(collectedCounts).reduce(function (sum, id) { return sum + collectedCounts[id]; }, 0);
    bagCountEl.style.display = n > 0 ? "flex" : "none";
    bagCountEl.textContent = n;
  }

  function playerTile() {
    return { x: Math.floor(player.x / TILE), y: Math.floor(player.y / TILE) };
  }

  function getSpotAt(x, y) {
    return mapSpots.find(function (s) { return s.x === x && s.y === y; });
  }

  function pickDigsRequired(key, x, y) {
    const rand = mulberry32(hashStringToSeed(key + "_dig_" + x + "_" + y));
    return rand() < 0.5 ? 3 : 4;
  }

  function tileBlockedAtPoint(px, py) {
    const tx = Math.floor(px / TILE), ty = Math.floor(py / TILE);
    return blockingTiles.has(tileKey(tx, ty));
  }
  function playerCollidesAt(px, py) {
    const r = 13;
    return tileBlockedAtPoint(px - r, py) || tileBlockedAtPoint(px + r, py) ||
      tileBlockedAtPoint(px, py - r) || tileBlockedAtPoint(px, py + r);
  }

  function doDig() {
    if (!currentMapKey || dig.active) return;
    const t = playerTile();
    const spot = getSpotAt(t.x, t.y);
    if (spot && spot.completed) return;
    dig.active = true;
    dig.t = 0;
    dig.impactDone = false;
    dig.spot = spot || null;
    dig.tile = t;
  }

  function performDigImpact() {
    const t = dig.tile;
    const spot = dig.spot;
    spawnDirt(player.x, player.y);
    if (spot) {
      spot.digCount++;
      if (spot.digCount >= spot.digsRequired) {
        spot.completed = true;
        if (spot.artifactId) {
          collectedCounts[spot.artifactId] = (collectedCounts[spot.artifactId] || 0) + 1;
          updateBagCount();
          spawnCollectPopup(getArtifactDef(spot.artifactId));
          bumpBagButton();
        }
      }
      persistMapState();
    } else {
      dugTiles.add(tileKey(t.x, t.y));
      persistMapState();
    }
  }

  function lerp(a, b, p) { return a + (b - a) * p; }
  function easeOutQuad(p) { return 1 - (1 - p) * (1 - p); }
  function easeInQuad(p) { return p * p; }
  function digAngle(t) {
    if (t < DIG_WINDUP) return lerp(0.3, -2.1, easeOutQuad(t / DIG_WINDUP));
    if (t < DIG_IMPACT_TIME) return lerp(-2.1, 0.9, easeInQuad((t - DIG_WINDUP) / (DIG_IMPACT_TIME - DIG_WINDUP)));
    const p = Math.min(1, (t - DIG_IMPACT_TIME) / (DIG_TOTAL - DIG_IMPACT_TIME));
    return lerp(0.9, 0.3, easeOutQuad(p));
  }

  function spawnDirt(px, py) {
    for (let i = 0; i < 8; i++) {
      particles.push({
        x: px,
        y: py,
        vx: (Math.random() - 0.5) * 140,
        vy: -Math.random() * 120 - 40,
        life: 0.5,
        age: 0
      });
    }
  }

  function spawnCollectPopup(artifact) {
    const rect = canvas.getBoundingClientRect();
    const stageRect = stage.getBoundingClientRect();
    const scaleX = rect.width / canvas.width;
    const scaleY = rect.height / canvas.height;
    const startLeft = rect.left - stageRect.left + player.x * scaleX;
    const startTop = rect.top - stageRect.top + player.y * scaleY;

    const el = document.createElement("div");
    el.className = "popupItem";
    el.style.left = startLeft + "px";
    el.style.top = startTop + "px";
    const entry = artifact.image ? getImage(artifact.image) : null;
    if (entry && entry.ok) {
      const img = document.createElement("img");
      img.src = artifact.image;
      el.appendChild(img);
    } else {
      const ph = document.createElement("div");
      ph.className = "placeholder";
      ph.textContent = artifact.name;
      el.appendChild(ph);
    }
    const nameTag = document.createElement("div");
    nameTag.className = "popupName";
    nameTag.textContent = artifact.name;
    el.appendChild(nameTag);
    popupLayer.appendChild(el);

    requestAnimationFrame(function () {
      el.style.width = "110px";
      el.style.height = "110px";
    });

    setTimeout(function () {
      const bagRect = bagBtn.getBoundingClientRect();
      el.style.left = (bagRect.left - stageRect.left + bagRect.width / 2) + "px";
      el.style.top = (bagRect.top - stageRect.top + bagRect.height / 2) + "px";
      el.style.width = "30px";
      el.style.height = "30px";
      el.style.opacity = "0";
    }, 650);

    setTimeout(function () { el.remove(); }, 1300);
  }

  function drawSpotProgress(px, py, progress) {
    const cx = px + TILE / 2, cy = py + TILE / 2;
    if (progress <= 0) {
      ctx.fillStyle = "rgba(255,255,255,0.18)";
      ctx.beginPath();
      ctx.ellipse(cx, cy + 4, 20, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(0,0,0,0.12)";
      ctx.beginPath();
      ctx.ellipse(cx, cy - 2, 18, 9, 0, 0, Math.PI * 2);
      ctx.fill();
      return;
    }
    const p = Math.min(1, progress);
    ctx.fillStyle = "rgba(90,60,30," + (0.15 + 0.35 * p) + ")";
    ctx.beginPath();
    ctx.ellipse(cx, cy, 10 + 12 * p, 6 + 8 * p, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function tileHash(x, y) {
    const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
    return n - Math.floor(n);
  }

  function drawMap() {
    ctx.fillStyle = mapDef.groundColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (let y = 0; y < mapDef.rows; y++) {
      for (let x = 0; x < mapDef.cols; x++) {
        const px = x * TILE, py = y * TILE;
        const h = tileHash(x, y);
        const toneIdx = Math.min(3, Math.floor(h * 4));
        ctx.fillStyle = groundTones[toneIdx] || mapDef.groundColor;
        ctx.fillRect(px, py, TILE, TILE);
        if (h > 0.9) {
          ctx.fillStyle = "rgba(0,0,0,0.05)";
          ctx.fillRect(px + 10, py + 14, 6, 6);
        }
        const key = tileKey(x, y);
        const spot = getSpotAt(x, y);
        if (spot) {
          drawSpotProgress(px, py, spot.digCount / spot.digsRequired);
        } else if (dugTiles.has(key)) {
          drawSpotProgress(px, py, 1);
        }
      }
    }
    drawDecorations();
    ctx.strokeStyle = "rgba(0,0,0,0.15)";
    ctx.lineWidth = 4;
    ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);
  }

  function drawDecorations() {
    for (let i = 0; i < decorations.length; i++) {
      const d = decorations[i];
      const cx = d.x * TILE + TILE / 2;
      const cy = d.y * TILE + TILE / 2;
      switch (d.type) {
        case "pine": drawPine(cx, cy); break;
        case "rock_big": drawRock(cx, cy, 15, d.variant); break;
        case "rock_small": drawRock(cx, cy, 8, d.variant); break;
        case "grass": drawGrassTuft(cx, cy, d.variant); break;
        case "broadleaf": drawBroadleaf(cx, cy, d.variant); break;
        case "bush": drawBush(cx, cy, d.variant); break;
        case "flower": drawFlower(cx, cy, d.variant); break;
      }
    }
  }

  function drawPine(cx, cy) {
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.beginPath();
    ctx.ellipse(cx, cy + 20, 14, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#6b4a2a";
    ctx.fillRect(cx - 4, cy + 4, 8, 16);
    const tones = ["#2f5d3a", "#3a6e44", "#44824f"];
    for (let i = 0; i < 3; i++) {
      const w = 26 - i * 7;
      const yy = cy + 8 - i * 14;
      ctx.fillStyle = tones[i];
      ctx.beginPath();
      ctx.moveTo(cx, yy - 18);
      ctx.lineTo(cx - w / 2, yy);
      ctx.lineTo(cx + w / 2, yy);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawBroadleaf(cx, cy, variant) {
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.beginPath();
    ctx.ellipse(cx, cy + 20, 16, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#7a5230";
    ctx.fillRect(cx - 4, cy + 2, 8, 18);
    const green = variant > 0.5 ? "#5a9150" : "#6ba55d";
    ctx.fillStyle = green;
    ctx.beginPath();
    ctx.ellipse(cx, cy - 10, 20, 18, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = shadeColor(green, 10);
    ctx.beginPath();
    ctx.ellipse(cx - 7, cy - 16, 10, 9, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawRock(cx, cy, size, variant) {
    ctx.fillStyle = "rgba(0,0,0,0.15)";
    ctx.beginPath();
    ctx.ellipse(cx, cy + size * 0.6, size * 1.1, size * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    const base = variant > 0.5 ? "#9b958a" : "#8a8378";
    ctx.fillStyle = base;
    ctx.beginPath();
    ctx.moveTo(cx - size, cy + size * 0.3);
    ctx.lineTo(cx - size * 0.5, cy - size * 0.7);
    ctx.lineTo(cx + size * 0.4, cy - size * 0.8);
    ctx.lineTo(cx + size, cy);
    ctx.lineTo(cx + size * 0.6, cy + size * 0.6);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = shadeColor(base, 12);
    ctx.beginPath();
    ctx.moveTo(cx - size * 0.5, cy - size * 0.7);
    ctx.lineTo(cx + size * 0.4, cy - size * 0.8);
    ctx.lineTo(cx + size * 0.1, cy - size * 0.2);
    ctx.closePath();
    ctx.fill();
  }

  function drawGrassTuft(cx, cy, variant) {
    ctx.strokeStyle = variant > 0.5 ? "#6fae4f" : "#5e9d44";
    ctx.lineWidth = 2;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(cx + i * 3, cy + 6);
      ctx.quadraticCurveTo(cx + i * 3 + 2, cy - 2, cx + i * 4, cy - 8);
      ctx.stroke();
    }
  }

  function drawBush(cx, cy, variant) {
    const green = variant > 0.5 ? "#5f9a52" : "#549047";
    ctx.fillStyle = "rgba(0,0,0,0.15)";
    ctx.beginPath();
    ctx.ellipse(cx, cy + 9, 14, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = green;
    ctx.beginPath();
    ctx.ellipse(cx - 7, cy + 2, 9, 8, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + 7, cy + 2, 9, 8, 0, 0, Math.PI * 2);
    ctx.ellipse(cx, cy - 4, 10, 9, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawFlower(cx, cy, variant) {
    const colors = ["#f2a6c6", "#f5d547", "#f0f0f0", "#e78a4e"];
    const color = colors[Math.floor(variant * colors.length) % colors.length];
    ctx.strokeStyle = "#4a8a3f";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy + 8);
    ctx.lineTo(cx, cy);
    ctx.stroke();
    for (let i = 0; i < 5; i++) {
      const angle = (i / 5) * Math.PI * 2;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.ellipse(cx + Math.cos(angle) * 4, cy - 4 + Math.sin(angle) * 4, 3, 3, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = "#f5c342";
    ctx.beginPath();
    ctx.ellipse(cx, cy - 4, 2.4, 2.4, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawHelmet() {
    ctx.fillStyle = "#f3c62e";
    ctx.beginPath();
    ctx.ellipse(0, -15, 12, 7, 0, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = "#d9a81e";
    ctx.beginPath();
    ctx.ellipse(0, -12, 13, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#c79412";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(0, -21);
    ctx.lineTo(0, -12);
    ctx.stroke();
  }

  function drawPlayer() {
    const x = player.x, y = player.y;
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = "rgba(0,0,0,0.2)";
    ctx.beginPath();
    ctx.ellipse(0, 18, 16, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#e3b878";
    ctx.beginPath();
    ctx.ellipse(0, 0, 16, 18, 0, 0, Math.PI * 2);
    ctx.fill();

    drawHelmet();

    ctx.fillStyle = "#c98f4e";
    ctx.beginPath();
    ctx.ellipse(-10, -16, 6, 6, 0, 0, Math.PI * 2);
    ctx.ellipse(10, -16, 6, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#fff3e0";
    ctx.beginPath();
    ctx.ellipse(-6, 4, 5, 4, 0, 0, Math.PI * 2);
    ctx.ellipse(6, 4, 5, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#2a1c10";
    const eyeOffsetX = player.dir === "left" ? -3 : player.dir === "right" ? 3 : 0;
    ctx.beginPath();
    ctx.ellipse(-5 + eyeOffsetX, -4, 2.3, 2.8, 0, 0, Math.PI * 2);
    ctx.ellipse(5 + eyeOffsetX, -4, 2.3, 2.8, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#b86b2f";
    ctx.beginPath();
    ctx.ellipse(0, 1, 2, 1.6, 0, 0, Math.PI * 2);
    ctx.fill();

    if (dig.active) drawPickaxe(player.dir, dig.t);
    ctx.restore();
  }

  function drawPickaxe(dir, t) {
    const pivot = {
      down: { x: 11, y: -2 },
      up: { x: 11, y: -24 },
      left: { x: -13, y: -10 },
      right: { x: 13, y: -10 }
    }[dir] || { x: 11, y: -10 };
    const mirror = dir === "left" ? -1 : 1;
    const angle = digAngle(t);
    ctx.save();
    ctx.translate(pivot.x, pivot.y);
    ctx.rotate(mirror * angle);
    ctx.scale(mirror, 1);
    ctx.strokeStyle = "#6b4a2a";
    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(22, -4);
    ctx.stroke();
    ctx.save();
    ctx.translate(22, -4);
    ctx.rotate(-0.5);
    ctx.fillStyle = "#8f98a3";
    ctx.beginPath();
    ctx.moveTo(-3, -9);
    ctx.lineTo(3, -9);
    ctx.lineTo(10, 2);
    ctx.lineTo(-10, 2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    ctx.restore();
  }

  function drawParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.age += dt;
      if (p.age >= p.life) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 260 * dt;
      const alpha = 1 - p.age / p.life;
      ctx.fillStyle = "rgba(110,75,40," + alpha + ")";
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  let lastTime = null;
  function loop(ts) {
    if (lastTime === null) lastTime = ts;
    const dt = Math.min((ts - lastTime) / 1000, 0.05);
    lastTime = ts;

    if (currentMapKey) {
      if (dig.active) {
        player.moving = false;
        dig.t += dt;
        if (!dig.impactDone && dig.t >= DIG_IMPACT_TIME) {
          performDigImpact();
          dig.impactDone = true;
        }
        if (dig.t >= DIG_TOTAL) dig.active = false;
      } else {
        let mx = joyVec.x, my = joyVec.y;
        if (keys["arrowleft"] || keys["a"]) mx = -1;
        if (keys["arrowright"] || keys["d"]) mx = 1;
        if (keys["arrowup"] || keys["w"]) my = -1;
        if (keys["arrowdown"] || keys["s"]) my = 1;

        const speed = 190;
        const len = Math.hypot(mx, my);
        if (len > 0.1) {
          const nx = mx / len, ny = my / len;
          const tryX = player.x + nx * speed * dt;
          const tryY = player.y + ny * speed * dt;
          if (!playerCollidesAt(tryX, player.y)) player.x = tryX;
          if (!playerCollidesAt(player.x, tryY)) player.y = tryY;
          player.moving = true;
          if (Math.abs(nx) > Math.abs(ny)) player.dir = nx < 0 ? "left" : "right";
          else player.dir = ny < 0 ? "up" : "down";
        } else {
          player.moving = false;
        }
        const maxX = mapDef.cols * TILE - 16;
        const maxY = mapDef.rows * TILE - 16;
        player.x = Math.max(16, Math.min(maxX, player.x));
        player.y = Math.max(16, Math.min(maxY, player.y));
      }

      drawMap();
      drawParticles(dt);
      drawPlayer();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  resize();

  const requestedMap = new URLSearchParams(location.search).get("map");
  if (requestedMap && MAPS[requestedMap]) startMap(requestedMap);
})();
</script>
</body>
</html>
