<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>고구려·발해 유물 수업 게임</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: linear-gradient(#5b4632, #3a2d20);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    color: #fff;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    box-sizing: border-box;
    min-height: 100vh;
  }
  h1 {
    font-size: clamp(22px, 4vw, 32px);
    text-align: center;
    margin-bottom: 8px;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.4);
  }
  p.sub {
    opacity: 0.85;
    margin-bottom: 36px;
    text-align: center;
    font-size: clamp(13px, 2vw, 16px);
  }
  .links {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .gameLink {
    display: block;
    width: clamp(180px, 26vw, 240px);
    padding: 26px 16px;
    border-radius: 18px;
    border: 4px solid #8a6a42;
    background: #caa868;
    color: #3a2a15;
    text-decoration: none;
    text-align: center;
    font-size: clamp(16px, 2.4vw, 20px);
    font-weight: bold;
    box-shadow: 0 6px 0 rgba(0,0,0,0.3);
  }
  .gameLink:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.3);
  }
  .gameLink .emoji {
    font-size: clamp(34px, 5vw, 48px);
    display: block;
    margin-bottom: 10px;
  }
</style>
</head>
<body>
  <h1>고구려·발해 유물 수업 게임</h1>
  <p class="sub">학생에게는 아래 두 링크 중 하나를 각각 나눠주세요.</p>
  <div class="links">
    <a class="gameLink" href="dig.html">
      <span class="emoji">⛏️</span>
      유적 발굴 게임
    </a>
    <a class="gameLink" href="memory.html">
      <span class="emoji">🂡</span>
      유물 짝 맞추기
    </a>
  </div>
</body>
</html>
